spring.application.name=stream-processor
server.port=8081

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/${POSTGRES_DB}?currentSchema=stream_processor
spring.flyway.default-schema=stream_processor
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# Fail fast when Postgres is down: the readiness check below waits on a connection and must answer within the probe's timeout
spring.datasource.hikari.connection-timeout=3000
spring.kafka.bootstrap-servers=127.0.0.1:9092

# suppress inspection "UnusedProperty"
pitwall.kafka.topics.laps=f1.laps

# One name for "the stream processor", shared by all its instances so they split the partitions
spring.kafka.consumer.group-id=stream-processor
# Only applies when the group has no committed offset: start from the oldest record so a new group sees laps already in the topic
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Counterpart of the JacksonJsonSerializer ingest uses
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
# Producer sends no type headers, so tell the deserializer the target type:
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=io.github.kcmodev.pitwall.processor.lap.LapEvent

spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

pitwall.kafka.topics.laps-dlt=f1.laps.DLT
# Keep partitions >= the laps topic's: the dead-letter recoverer publishes to the same partition number as the failed record
pitwall.kafka.topics.laps-dlt-partitions=3
pitwall.kafka.topics.laps-dlt-replicas=1

# Fail startup if Kafka is unreachable, instead of logging and starting without the declared topics.
# KafkaAdmin only creates topics at startup, so the restart is what gets them created.
spring.kafka.admin.fail-fast=true

# Kafka Streams (RaceMetricsTopology). Bootstrap servers come from spring.kafka.bootstrap-servers; the
# spring.kafka.consumer.* settings above are the listener's and don't apply to Streams.
# application.id is the Streams consumer group, and the prefix of its internal topics and local state directory.
# Changing it later starts over (new group, new internal topics, empty state), so it's chosen once.
spring.kafka.streams.application-id=stream-processor-race-metrics

# A record that isn't valid JSON is logged and skipped. The listener already dead-letters the same bad records
# from f1.laps, so Streams doesn't keep a second copy (its own DLQ is a later decision).
spring.kafka.streams.properties.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler

# Readiness reports DOWN while Postgres is unreachable; liveness stays UP so Kubernetes doesn't restart a healthy app during an outage
# suppress inspection "UnusedProperty"
management.endpoint.health.group.readiness.include=readinessState,db

# Kafka Streams in liveness: an ERROR state never recovers on its own, and a restart fixes it
management.endpoint.health.group.liveness.include=livenessState,kafkaStreams
