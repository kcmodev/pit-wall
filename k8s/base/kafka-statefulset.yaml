apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: pit-wall
  labels:
    app.kubernetes.io/name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
    spec:
      # Kubernetes would otherwise inject KAFKA_PORT, KAFKA_SERVICE_HOST, ... for the `kafka` Service,
      # and the image turns every KAFKA_* variable into a broker property.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000              # the image runs as appuser (uid 1000); lets it write to the volume
      containers:
        - name: kafka
          image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
          ports:
            - name: kafka
              containerPort: 9092
          # Single combined broker/controller in KRaft mode, matching compose.yaml.
          # Only one client listener: everything that connects is inside the cluster.
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            # The start script defaults to a 1G heap; keep it inside the container limit
            - name: KAFKA_HEAP_OPTS
              value: "-Xms512m -Xmx512m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          # A TCP check rather than kafka-broker-api-versions.sh: the CLI starts a second JVM on every probe.
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 1Gi
  volumeClaimTemplates:          # one disk per pod, kept across restarts
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi