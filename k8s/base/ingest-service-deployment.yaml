apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-service
  namespace: pit-wall
  labels:
    app.kubernetes.io/name: ingest-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingest-service   # how the Deployment finds its pods
  template:                                    # the pod blueprint
    metadata:
      labels:
        app.kubernetes.io/name: ingest-service # must match the selector above
    spec:
      containers:
        - name: ingest-service
          image: pit-wall/ingest-service:0.2
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080 # default spring boot port
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/pitwall
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 30     # allows up to 60s to start
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3