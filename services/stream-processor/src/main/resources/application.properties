spring.application.name=stream-processor
server.port=8081

spring.kafka.bootstrap-servers=127.0.0.1:9092
pitwall.kafka.topics.laps=f1.laps

# One name for "the stream processor", shared by all its instances so they split the partitions
spring.kafka.consumer.group-id=stream-processor
# Only applies when the group has no committed offset: start from the oldest record so a new group sees laps already in the topic
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Counterpart of the JacksonJsonSerializer ingest uses
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
# Producer sends no type headers, so tell the deserializer the target type:
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=io.github.kcmodev.pitwall.processor.lap.LapEvent
