name: CI

on:
  push:
    branches: [main]
    # A release tag (v0.4.0) runs the whole pipeline and publishes the version-tagged images.
    tags: ['v*']
  pull_request:

# Read-only token by default; a job that needs more asks for it (the image job pushes to GHCR).
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # Let both services finish, so one failure doesn't hide the other's result.
      fail-fast: false
      matrix:
        service: [ingest-service, stream-processor]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      # Third-party actions are pinned to a full commit SHA; a tag can be moved to different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle's dependencies between runs and validates the Gradle wrapper jar.
      - uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1

      # `build` compiles, runs the tests and assembles the boot jar.
      - run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/reports/tests/
          retention-days: 7

  image:
    name: Image (${{ matrix.service }})
    # Only build images from code whose tests passed (waits for both services' build jobs).
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only this job can write packages. The token's permissions are per job, so the test job stays read-only.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [ingest-service, stream-processor]

    steps:
      # A path context (below) builds from the checked-out files, so the checkout is required.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Lets the amd64 runner execute arm64 binaries (emulated), for the arm64 image's RUN steps.
      # Only the runtime stage's user setup runs emulated; the Gradle build runs natively (see Dockerfile).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      # Buildx runs builds on BuildKit, which the next steps (layer cache, multi-arch, push) need.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Image tags and OCI labels (source repo, commit, created time), computed from the event:
      #   push to main       -> sha-<short sha>
      #   release tag v1.2.3 -> 1.2.3 and sha-<short sha>
      #   pull request       -> sha-<short sha> (built, never pushed)
      # Only tags that never move: no "latest", "main" or "1.2", so a tag always means the same image.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha

      # Pull requests can come from forks, so they never get a token that can publish.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Builds the same Dockerfile as local builds; pushes everything except pull requests.
      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ matrix.service }}
          # One tag, two images: the registry stores an index, and each machine pulls its own architecture.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in GitHub's Actions cache, one scope per service so they don't evict each other.
          # mode=max also caches the build stage (where the dependency layer lives), not only the final image.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
