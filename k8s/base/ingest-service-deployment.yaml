apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-service
  namespace: pit-wall
  labels:
    app.kubernetes.io/name: ingest-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingest-service   # how the Deployment finds its pods
  template:                                    # the pod blueprint
    metadata:
      labels:
        app.kubernetes.io/name: ingest-service # must match the selector above
    spec:
      containers:
        - name: ingest-service
          image: pit-wall/ingest-service
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080 # default spring boot port
          resources:
            requests:
              cpu: 250m          # a quarter of one CPU core
              memory: 512Mi
            limits:
              memory: 512Mi
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/pitwall
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
            # Matches compose.yaml. Local development only; a production overlay will drop it.
            - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
              value: "always"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 30     # allows up to 60s to start
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
