apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-processor
  namespace: pit-wall
  labels:
    app.kubernetes.io/name: stream-processor
spec:
  replicas: 1   # more instances split f1.laps's partitions, up to its partition count (3)
  selector:
    matchLabels:
      app.kubernetes.io/name: stream-processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stream-processor
    spec:
      containers:
        - name: stream-processor
          image: pit-wall/stream-processor
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8081 # server.port in application.properties
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/$(POSTGRES_DB)?currentSchema=stream_processor
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0"
            # Matches compose.yaml. Local development only; a production overlay will drop it.
            - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
              value: "always"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 30     # allows up to 60s to start
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3